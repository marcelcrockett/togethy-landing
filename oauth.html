<!DOCTYPE html>
<html>
<head>
  <title>Togethy - Connecting...</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #F5F7FA; }
    .container { text-align: center; padding: 32px; }
    h2 { color: #1F2D4E; }
    p { color: #888; }
  </style>
</head>
<body>
  <div class="container">
    <h2>✅ Bank Connected!</h2>
    <p>You can now close this window and return to Togethy.</p>
    <p style="margin-top: 16px; font-size: 13px; color: #AAA;">If this window doesn't close automatically, tap Done above.</p>
  </div>
  <script>
    // Try to close the browser window
    window.close();
    
    // Try to redirect back to the app
    setTimeout(function() {
      window.location.href = 'togethy://oauth?url=' + encodeURIComponent(window.location.href);
    }, 500);
  </script>
</body>
</html>
